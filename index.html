<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PONG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #0b0c10;
            border: 1px solid rgb(216, 216, 216);
        }
    </style>
</head>
<body>
    <canvas id="c" width="480" height="520"></canvas>
    <script>
        var canvas = document.getElementById("c"),
            ctx    = canvas.getContext('2d');

        var W = canvas.width,
            H = canvas.height;

        var keys     = {},
            lastTime = 0;

        var shake = { timer: 0, _int: 8, x: 0, y: 0 };

        // High Score
        var highScore = parseInt(localStorage.getItem('pongHS') || '0');

        var PH_BASE = 80,   // tinggi awal paddle
            PW      = 20;

        var PH_MIN  = 30,   // batas minimum paddle
            PH_MAX  = 160;  // batas maksimum paddle

        var WIN_SCORE = 3;
        var baseAiSpd = 220;

        // Mode
        var endlessMode = false;

        // Game State 
        var gameState = 'splash';
        var winner    = "";

        var slowMoTimer = 0,
            isSlowMo    = false;

        // Paddles
        var paddle = [
            { x: 10,          y: H/2 - PH_BASE/2, w: PW, h: PH_BASE, spd: 320, score: 0, label: 'P1' },
            { x: W-10-PW,     y: H/2 - PH_BASE/2, w: PW, h: PH_BASE, spd: 320, score: 0, label: 'P2' }
        ];
        var paddleMode = ['human', 'ai'];
        var KEYS = [
            { up: 'w', down: 's' },
            { up: 'i', down: 'k' }
        ];

        // Ball
        var ball = { x: W/2, y: H/2, vx: 200, vy: 150, r: 9, trail: [] };

        // Freeze Timer per paddle
        var freezeTimer = [0, 0];

        // Power-ups
        var isPowerBall  = false;
        var powerType    = null;
        var POWER_CHANCE = 0.20;

        // Particles
        var particles = [];

        // Variabel animasi denyut paddle (Fitur 1)
        var pulseTime = 0;

        function emitP(x, y, color, count) {
            count = count || 6;
            for (var i = 0; i < count * 3; i++) {
                var angle = (Math.PI*2 / (count*3)) * i + (Math.random()-0.5)*0.5;
                var spd   = 80 + Math.random()*200;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
                    life: 1.0, decay: 0.9 + Math.random()*0.7,
                    r: 2 + Math.random()*3, color: color
                });
            }
        }

        function updateParticles(dt) {
            for (var i = particles.length-1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.vx*dt; p.y += p.vy*dt;
                p.vx *= 0.92;   p.vy *= 0.92;
                p.life -= p.decay*dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Floating Texts
        var floatTexts = [];

        function spawnFloat(x, y, text, color) {
            floatTexts.push({ text: text, x: x, y: y, life: 1.0, color: color });
        }

        function updateFloatTexts(dt) {
            for (var i = floatTexts.length-1; i >= 0; i--) {
                floatTexts[i].y    -= 50*dt;
                floatTexts[i].life -= dt*0.9;
                if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }
        }

        function drawFloatTexts() {
            for (var i = 0; i < floatTexts.length; i++) {
                var ft = floatTexts[i];
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.font        = 'bold 20px Arial';
                ctx.textAlign   = 'center';
                ctx.fillStyle   = ft.color;
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur  = 8;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        // Pause Options
        var pauseOption  = 0;
        var pauseOptions = [
            { label: 'P1 Human  vs  AI',         modes: ['human','ai'] },
            { label: 'P1 Human  vs  P2 Human',  modes: ['human','human'] },
            { label: 'AI       vs  P2 Human',   modes: ['ai','human'] }
        ];

        // --- AUDIO ---
        var audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBlip(freq, duration) {
            if (!audioCtx) return; 
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                var osc  = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain); 
                gain.connect(audioCtx.destination);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.start(audioCtx.currentTime); 
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Audio play blocked or failed:", e);
            }
        }

        // High Score
        function checkAndSaveHighScore() {
            var current = Math.max(paddle[0].score, paddle[1].score);
            if (current > highScore) {
                highScore = current;
                localStorage.setItem('pongHS', highScore.toString());
            }
        }

        // Power-up helpers
        function trySpawnPower() {
            if (Math.random() < POWER_CHANCE) {
                var roll = Math.random();
                isPowerBall = true;
                if (roll < 1/3) {
                    powerType = 'freeze';
                } else if (roll < 2/3) {
                    powerType = 'grow';
                } else {
                    powerType = 'shrink';
                }
            }
        }

        function applyPowerToPaddle(idx) {
            var label = '';
            var col = '#fff';

            if (powerType === 'freeze') {
                freezeTimer[idx] = 3.0;
                label = 'FROZEN';
                col = '#00cfff';
            } else if (powerType === 'grow') {
                paddle[idx].h = Math.max(PH_MIN, Math.min(PH_MAX, paddle[idx].h + 20));
                label = '+GROW';
                col = '#ffe066';
            } else if (powerType === 'shrink') {
                paddle[idx].h = Math.max(PH_MIN, Math.min(PH_MAX, paddle[idx].h - 20));
                label = '-SHRINK';
                col = '#ff6b6b';
            }

            paddle[idx].y = Math.max(0, Math.min(H - paddle[idx].h, paddle[idx].y));
            spawnFloat(paddle[idx].x + PW/2 + (idx === 0 ? 40 : -40), paddle[idx].y + paddle[idx].h/2, label, col);
            emitP(ball.x, ball.y, col, 6);
            playBlip(powerType === 'grow' ? 660 : 220, 0.18);
            
            isPowerBall = false;
            powerType   = null;
            ball.trail  = []; // Membersihkan sisa ekor power-up instan
        }

        // Reset
        function resetBall(vx) {
            ball.x     = W/2; ball.y = H/2;
            ball.vx    = vx;
            ball.vy    = (Math.random()>0.5?1:-1) * (120 + Math.random()*60);
            ball.trail = [];
            isPowerBall = false;
            powerType   = null;
            trySpawnPower();
        }

        function resetGame() {
            paddle[0].score = 0; paddle[1].score = 0;
            paddle[0].y     = H/2 - PH_BASE/2; paddle[0].h = PH_BASE;
            paddle[1].y     = H/2 - PH_BASE/2; paddle[1].h = PH_BASE;
            slowMoTimer     = 0; isSlowMo = false;
            winner          = "";
            isPowerBall     = false; powerType = null;
            freezeTimer[0]  = 0; freezeTimer[1] = 0;
            shake.timer     = 0; shake.x = 0; shake.y = 0;
            particles       = []; floatTexts = [];
            pulseTime       = 0;
            
            var randomStartVx = Math.random() > 0.5 ? 200 : -200;
            resetBall(randomStartVx);
        }

        function applyPauseOption(idx) {
            paddleMode[0]   = pauseOptions[idx].modes[0];
            paddleMode[1]   = pauseOptions[idx].modes[1];
            paddle[0].label = (paddleMode[0]==='human') ? 'P1' : 'AI';
            paddle[1].label = (paddleMode[1]==='human') ? 'P2' : 'AI';
        }

        // Fungsi pembantu untuk mendapatkan warna dinamis bola berdasarkan kecepatan (Fitur 4)
        function getBallColorBySpeed() {
            if (isPowerBall) {
                if (powerType === 'freeze') return '#00cfff';
                if (powerType === 'grow') return '#ffe066';
                if (powerType === 'shrink') return '#ff6b6b';
            }
            var speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            // Normalisasi rentang kecepatan: anggap 250 ke bawah itu lambat (biru), 450 ke atas itu cepat (merah)
            var minSpd = 250;
            var maxSpd = 450;
            var ratio = Math.max(0, Math.min(1, (speed - minSpd) / (maxSpd - minSpd)));
            
            // Interpolasi warna dari Biru (#4facfe) ke Merah (#ff4b4b)
            var r = Math.round(79 + (255 - 79) * ratio);
            var g = Math.round(172 + (75 - 172) * ratio);
            var b = Math.round(254 + (75 - 254) * ratio);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        // Update
        function update(dt) {
            if (gameState !== 'playing') return;

            updateParticles(dt);
            updateFloatTexts(dt);

            // Update waktu denyut paddle (Fitur 1)
            pulseTime += dt * 7; 

            if (shake.timer > 0) {
                shake.timer -= dt;
                shake.x = (Math.random()-0.5) * shake._int;
                shake.y = (Math.random()-0.5) * shake._int;
            } else { shake.x = 0; shake.y = 0; }

            isSlowMo = slowMoTimer > 0;
            if (slowMoTimer > 0) slowMoTimer -= dt;
            var cdt = isSlowMo ? dt * 0.4 : dt; // Fitur 3: Manipulasi Delta Time global saat slow-mo aktif

            for (var i = 0; i < 2; i++) {
                if (freezeTimer[i] > 0) { freezeTimer[i] -= dt; continue; }
                if (paddleMode[i] === 'human') {
                    if (keys[KEYS[i].up])   paddle[i].y -= paddle[i].spd * cdt;
                    if (keys[KEYS[i].down]) paddle[i].y += paddle[i].spd * cdt;
                } else {
                    var tgt = (isPowerBall && (powerType === 'freeze' || powerType === 'shrink'))
                        ? (ball.y < H/2 ? H - paddle[i].h : 0)
                        : ball.y - paddle[i].h/2;
                    var diff = tgt - paddle[i].y;
                    paddle[i].y += Math.sign(diff) * Math.min(Math.abs(diff), baseAiSpd*cdt);
                }
                paddle[i].y = Math.max(0, Math.min(H - paddle[i].h, paddle[i].y));
            }

            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 10) ball.trail.shift();

            ball.x += ball.vx * cdt;
            ball.y += ball.vy * cdt;

            if (ball.y - ball.r < 0) {
                ball.y  = ball.r; ball.vy = Math.abs(ball.vy);
                if (!isPowerBall) trySpawnPower();
                playBlip(300, 0.08);
            }
            if (ball.y + ball.r > H) {
                ball.y  = H - ball.r; ball.vy = -Math.abs(ball.vy);
                if (!isPowerBall) trySpawnPower();
                playBlip(300, 0.08);
            }

            var p0 = paddle[0];
            if (ball.vx < 0 &&
                ball.x - ball.r < p0.x + PW &&
                ball.y > p0.y && ball.y < p0.y + p0.h
            ) {
                var currentBallColor = getBallColorBySpeed();
                if (isPowerBall) { 
                    applyPowerToPaddle(0); 
                } else { 
                    emitP(p0.x+PW, ball.y, currentBallColor, 6); 
                }
                ball.vx = Math.abs(ball.vx) * 1.05;
                ball.vy = ((ball.y-(p0.y+p0.h/2)) / (p0.h/2)) * 220;
                if (!isPowerBall) trySpawnPower();
                playBlip(500, 0.1);
                slowMoTimer = 0.5; // Fitur 3: Picu slow motion durasi 0.5 detik
            }

            var p1 = paddle[1];
            if (ball.vx > 0 &&
                ball.x + ball.r > p1.x &&
                ball.y > p1.y && ball.y < p1.y + p1.h
            ) {
                var currentBallColor = getBallColorBySpeed();
                if (isPowerBall) { 
                    applyPowerToPaddle(1); 
                } else { 
                    emitP(p1.x, ball.y, currentBallColor, 6); 
                }
                ball.vx = -Math.abs(ball.vx) * 1.05;
                ball.vy = ((ball.y-(p1.y+p1.h/2)) / (p1.h/2)) * 220;
                if (!isPowerBall) trySpawnPower();
                playBlip(400, 0.1);
                slowMoTimer = 0.5; // Fitur 3: Picu slow motion durasi 0.5 detik
            }

            // Goal kiri
            if (ball.x - ball.r < 0) {
                if (isPowerBall && (powerType === 'freeze' || powerType === 'shrink')) {
                    ball.x = ball.r; ball.vx = Math.abs(ball.vx); isPowerBall = false; powerType = null; ball.trail = []; playBlip(200, 0.12);
                } else {
                    paddle[1].score++;
                    checkAndSaveHighScore();
                    var p2Text = (paddleMode[0] === 'human' && paddleMode[1] === 'ai') ? 'AI Point!' : paddle[1].label + ' Point!';
                    spawnFloat(W/2, H/2-30, p2Text, '#ff6b6b');
                    playBlip(150, 0.3);
                    resetBall(200);
                    if (!endlessMode && paddle[1].score >= WIN_SCORE) {
                        gameState = 'gameover'; winner = paddle[1].label;
                    }
                }
            }

            // Goal kanan
            if (ball.x + ball.r > W) {
                if (isPowerBall && (powerType === 'freeze' || powerType === 'shrink')) {
                    ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); isPowerBall = false; powerType = null; ball.trail = []; playBlip(200, 0.12);
                } else {
                    paddle[0].score++;
                    checkAndSaveHighScore();
                    var p1Text = (paddleMode[0] === 'human' && paddleMode[1] === 'ai') ? 'Your Point!' : paddle[0].label + ' Point!';
                    spawnFloat(W/2, H/2-30, p1Text, '#4facfe');
                    playBlip(800, 0.2);
                    resetBall(-200);
                    if (!endlessMode && paddle[0].score >= WIN_SCORE) {
                        gameState = 'gameover'; winner = paddle[0].label;
                    }
                }
            }
        }

        // Render Grid
        function drawGridBg() {
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
            for (var i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
            for (var i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
        }

        function drawOverlayBg() { ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H); }
        function drawCenterTitle(text, color, y) { ctx.fillStyle = color; ctx.font = 'bold 72px Arial'; ctx.textAlign = 'center'; ctx.fillText(text, W/2, y); }
        function drawCenterSub(text, color, y, size) { ctx.fillStyle = color; ctx.font = (size||18)+'px Arial'; ctx.textAlign = 'center'; ctx.fillText(text, W/2, y); }
        function drawCenterLine() {
            ctx.save(); ctx.setLineDash([12,10]); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.restore();
        }

        // Modifikasi Fungsi Menggambar Paddle untuk Efek Berdenyut (Fitur 1)
        function drawPaddleWithGlow(idx, defaultColor) {
            var p = paddle[idx];
            ctx.save();
            
            // Hitung jarak horizontal dari bola ke permukaan paddle terdekat
            var distanceX = 0;
            if (idx === 0) {
                distanceX = Math.abs(ball.x - (p.x + p.w));
            } else {
                distanceX = Math.abs(p.x - ball.x);
            }
            
            var glowSize = 10; // Nilai dasar glow jika bola jauh
            
            // Jika bola mendekat dalam radius 100px secara horizontal, lakukan modulasi sinus (denyut)
            if (distanceX <= 100) {
                var amplitude = 12; // Kekuatan rentang tambahan denyutan (10 - 22)
                glowSize = 10 + Math.abs(Math.sin(pulseTime)) * amplitude;
            }
            
            ctx.shadowBlur = glowSize; 
            ctx.shadowColor = defaultColor; 
            ctx.fillStyle = defaultColor; 
            ctx.fillRect(p.x, p.y, p.w, p.h); 
            ctx.restore();
        }

        // Modifikasi Fungsi Menggambar Bola untuk Warna Dinamis Kecepatan (Fitur 4)
        function drawBallWithGlow() {
            var ballColor = getBallColorBySpeed();
            var symbol = '';
            
            if (isPowerBall) {
                if (powerType === 'freeze') symbol = '❄';
                else if (powerType === 'grow') symbol = '+';
                else if (powerType === 'shrink') symbol = '−';
            }
            
            ctx.save();
            ctx.shadowBlur = 14; 
            ctx.shadowColor = ballColor; 
            ctx.fillStyle = ballColor;
            ctx.beginPath(); 
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); 
            ctx.fill(); 
            ctx.restore();

            if (isPowerBall && symbol !== '') {
                ctx.save(); ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#111';
                ctx.fillText(symbol, ball.x, ball.y + 4); ctx.restore();
            }
        }

        // Splash
        function drawSplash() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,W,H); drawGridBg();
            drawCenterTitle('PONG', '#ffff00', H/2 - 60);
            drawCenterSub('Tekan ENTER untuk mulai', 'rgba(255,255,255,0.5)', H/2, 18);

            var modeLabel = pauseOptions[pauseOption].label.trim();
            if (endlessMode) modeLabel += ' (∞ Endless)';
            drawCenterSub('Mode: ' + modeLabel, 'rgba(255,255,255,0.3)', H/2+28, 13);
            drawCenterSub('Power-up:   🔵 Freeze 🟡 Grow  🔴 Shrink', 'rgba(255,255,255,1)', H/2+60, 12);
            drawCenterSub('ESC / P = Pause & Setting Mode', 'rgba(255,255,255,1)', H/2+78, 12);

            if (highScore > 0) drawCenterSub('Highscore: ' + highScore, '#ffcc00', H/2+106, 13);
        }

        // Pause
        function drawPause() {
            drawOverlayBg();

            ctx.fillStyle = '#ffff00'; ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center'; ctx.fillText('PAUSE', W/2, H/2 - 140);

            drawCenterSub('--- PILIH LAWAN ---', 'rgba(255,255,255,0.4)', H/2 - 100, 12);

            for (var i = 0; i < pauseOptions.length; i++) {
                var isSel = (i === pauseOption);
                var oy    = H/2 - 75 + i * 36;

                if (isSel) {
                    ctx.fillStyle   = 'rgba(79,172,254,0.15)';
                    ctx.strokeStyle = '#4facfe'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.roundRect(W/2-140, oy-15, 280, 26, 4); ctx.fill(); ctx.stroke();
                }

                ctx.fillStyle = isSel ? '#4facfe' : 'rgba(255,255,255,0.4)';
                ctx.font      = (isSel ? 'bold ' : '') + '14px Arial';
                ctx.fillText(pauseOptions[i].label, W/2, oy+4);
            }

            var endlessY = H/2 + 45;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath(); ctx.moveTo(W/2-100, endlessY-15); ctx.lineTo(W/2+100, endlessY-15); ctx.stroke();

            drawCenterSub('--- ATURAN WIN SCORE ---', 'rgba(255,255,255,0.4)', endlessY, 11);
            
            ctx.font = 'bold 15px Arial';
            var toggleText = endlessMode ? "◀  ENDLESS MODE: [ON]  ▶" : "◀  ENDLESS MODE: [OFF]  ▶";
            ctx.fillStyle = endlessMode ? '#ffe066' : 'rgba(255,255,255,0.6)';
            ctx.fillText(toggleText, W/2, endlessY + 24);

            drawCenterSub('↑ ↓ Pilih Lawan  |  ◀ ▶ Toggle Endless', 'rgba(255,255,255,0.4)', H/2+115, 12);
            drawCenterSub('ENTER Konfirmasi  |  ESC / P Lanjutkan', 'rgba(255,255,255,0.25)', H/2+133, 11);
        }

        // Game Over
        function drawGameOver() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,W,H); drawGridBg(); drawOverlayBg();
            var isAiWin   = (winner=='AI' && paddleMode[0]=='human' && paddleMode[1]=='ai');
            var titleText = isAiWin ? 'YOU LOSE!' : winner + ' MENANG!';
            var titleCol  = winner===paddle[0].label ? '#4facfe' : '#ff6b6b';

            drawCenterTitle(titleText, titleCol, H/2 - 50);
            ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '15px Arial'; ctx.textAlign = 'center';
            ctx.fillText(paddle[0].label+' '+paddle[0].score+' : '+paddle[1].score+' '+paddle[1].label, W/2, H/2);

            ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 22px Arial';
            ctx.fillText('HIGH SCORE: ' + highScore, W/2, H/2+40);
            drawCenterSub('ENTER / R  Main lagi  |  P  Menu Utama', 'rgba(255,255,255,0.4)', H/2+90, 15);
        }

        // Main Game Render
        function drawGame() {
            ctx.save(); ctx.translate(shake.x, shake.y);
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,W,H); drawGridBg(); drawCenterLine();

            var p0Color = freezeTimer[0]>0 ? '#a0e0ff' : '#4facfe',
                p1Color = freezeTimer[1]>0 ? '#a0e0ff' : '#ff6b6b';
            
            // Panggil fungsi gambar paddle baru dengan modulasi denyut (Fitur 1)
            drawPaddleWithGlow(0, p0Color); 
            drawPaddleWithGlow(1, p1Color);

            // Ambil warna dinamis untuk diaplikasikan ke ekor trail (Fitur 4)
            var trailColor = getBallColorBySpeed();
            
            for (var i = 0; i < ball.trail.length; i++) {
                ctx.save();
                ctx.globalAlpha = (i / ball.trail.length) * 0.35; 
                ctx.fillStyle = trailColor; 
                ctx.beginPath();
                ctx.arc(ball.trail[i].x, ball.trail[i].y, ball.r * (i/ball.trail.length) * 0.9, 0, Math.PI*2); 
                ctx.fill();
                ctx.restore();
            }

            drawBallWithGlow(); drawParticles(); drawFloatTexts();

            // HUD Skor Utama
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = 'bold 60px Arial'; ctx.textAlign = 'center';
            ctx.fillText(paddle[0].score + ' : ' + paddle[1].score, W/2, 80);

            ctx.fillStyle = '#ffcc00'; ctx.font = '11px Arial';
            var hudLine = 'BEST ' + highScore;
            if (endlessMode) hudLine += '  ∞ ENDLESS';
            ctx.fillText(hudLine, W/2, 96);

            ctx.fillStyle = '#4facfe'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
            ctx.fillText(paddle[0].label+(paddleMode[0]==='ai'?' (AI)':''), 20, 105);
            ctx.fillStyle = '#ff6b6b'; ctx.textAlign = 'right';
            ctx.fillText(paddle[1].label+(paddleMode[1]==='ai'?' (AI)':''), W-20, 105);

            if (freezeTimer[0] > 0) { ctx.fillStyle='#a0e0ff'; ctx.font='11px Arial'; ctx.textAlign='left'; ctx.fillText('FREEZE '+Math.ceil(freezeTimer[0])+'s', 20, 118); }
            if (freezeTimer[1] > 0) { ctx.fillStyle='#a0e0ff'; ctx.font='11px Arial'; ctx.textAlign='right'; ctx.fillText('FREEZE '+Math.ceil(freezeTimer[1])+'s', W-20, 118); }

            // HUD Info Power-up Aktif di Bawah Layar
            if (isPowerBall) {
                if (powerType === 'freeze') { ctx.fillStyle = '#00cfff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('🔵 FREEZE ball', W/2, H-12); }
                else if (powerType === 'grow') { ctx.fillStyle = '#ffe066'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('🟡 +GROW ball', W/2, H-12); }
                else if (powerType === 'shrink') { ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('🔴 -SHRINK ball', W/2, H-12); }
            }
            
            if (paddle[0].h !== PH_BASE) { ctx.fillStyle = paddle[0].h > PH_BASE ? '#ffe066' : '#ff6b6b'; ctx.font='10px Arial'; ctx.textAlign='left'; ctx.fillText('H:'+paddle[0].h, 20, 130); }
            if (paddle[1].h !== PH_BASE) { ctx.fillStyle = paddle[1].h > PH_BASE ? '#ffe066' : '#ff6b6b'; ctx.font='10px Arial'; ctx.textAlign='right'; ctx.fillText('H:'+paddle[1].h, W-20, 130); }

            // Fitur 2: Speedometer Akurat Real-time HUD Menggunakan Math.sqrt
            var spd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ctx.fillStyle = isSlowMo ? '#ff6b6b' : 'rgba(255,255,255,0.4)'; ctx.font='12px Arial'; ctx.textAlign='left';
            ctx.fillText('SPD ' + Math.round(spd) + (isSlowMo ? '   SLOW-MO' : ''), 20, 28);
            ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.textAlign='right'; ctx.fillText('P = Pause', W-20, 28);

            ctx.restore();
        }

        function render() {
            if (gameState==='splash')   { drawSplash();   return; }
            if (gameState==='gameover') { drawGameOver(); return; }
            drawGame();
            if (gameState==='pause') drawPause();
        }

        function loop(ts) {
            var dt = Math.min((ts-lastTime)/1000, 0.05); lastTime = ts;
            update(dt); render(); requestAnimationFrame(loop);
        }

        // Event Listener
        document.addEventListener('keydown', function(e) {
            keys[e.key] = true;
            initAudio();

            if (gameState==='splash' && e.key==='Enter') {
                applyPauseOption(pauseOption); resetGame(); gameState='playing'; return;
            }

            if (gameState==='playing') {
                if (e.key==='p' || e.key==='P' || e.key==='Escape') { gameState='pause'; return; }
                if (e.key==='Shift' && slowMoTimer<=0) { slowMoTimer=1.0; } // Slow-mo manual bawaan via shift
                if (e.key==='r'||e.key==='R') { resetGame(); gameState='playing'; return; }
            }

            if (gameState==='pause') {
                if (e.key==='ArrowUp')   pauseOption=(pauseOption-1+pauseOptions.length)%pauseOptions.length;
                if (e.key==='ArrowDown') pauseOption=(pauseOption+1)%pauseOptions.length;
                
                if (e.key==='ArrowLeft' || e.key==='ArrowRight') {
                    endlessMode = !endlessMode;
                    playBlip(600, 0.05);
                }

                if (e.key==='Enter')  { applyPauseOption(pauseOption); resetGame(); gameState='playing'; }
                if (e.key==='p' || e.key==='P' || e.key==='Escape') { gameState='playing'; }
                if (e.key==='r'||e.key==='R') { resetGame(); gameState='playing'; }
                return;
            }

            if (gameState==='gameover') {
                if (e.key==='Enter'||e.key==='r'||e.key==='R') { resetGame(); gameState='playing'; }
                if (e.key==='p'||e.key==='P') { gameState='splash'; }
            }
        });

        document.addEventListener('keyup', function(e) { keys[e.key]=false; });
        requestAnimationFrame(function(ts) { lastTime=ts; requestAnimationFrame(loop); });
    </script>
</body>
</html>
